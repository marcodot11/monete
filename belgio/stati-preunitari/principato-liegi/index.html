<!DOCTYPE html>
<html>
<head>
    <title>Principato Vescovile di Liegi - Monete</title>
    <!-- Torna indietro di 3 cartelle per il CSS -->
    <link rel="stylesheet" href="../../../style.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Stati Preunitari del Belgio</h1>
    <h2>Principato Vescovile di Liegi</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- PRINCIPE-VESCOVO GIOVANNI TEODORO DI BAVIERA -->
    <h3 style="text-align: center; margin-top: 40px;">Principe-Vescovo Giovanni Teodoro di Baviera</h3>
    
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; text-align: center; flex-wrap: wrap;">
        
        <!-- 1 Liard 1751 -->
        <div>
            <h4>1 Liard</h4>
            <img src="1liard-1751-fronte.jpg" data-front="1liard-1751-fronte.jpg" data-back="1liard-1751-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1751</strong></p>
        </div>

    </div>

    <!-- Script per girare le monete -->
    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

</body>
</html>
