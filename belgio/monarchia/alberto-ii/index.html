<!DOCTYPE html>
<html>
<head>
    <title>Alberto II - Belgio</title>
    <link rel="stylesheet" href="../../../style.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Belgio</h1>
    <h2>Monarchia (Alberto II)</h2>
    <hr>
    
    <p style="text-align: center; margin-bottom: 40px;">Clicca sulle monete per vedere il retro</p>

    <h3 style="text-align: center; margin-top: 50px; font-size: 1.5em;">Alberto II (1993 - 2013)</h3>
    
    <!-- 1 Franc -->
    <h4 style="text-align: left; margin-left: 10%; margin-bottom: 10px;">1 Franc</h4>
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; text-align: center; flex-wrap: wrap;">
        <div><img src="1franc-1-fronte.jpg" data-front="1franc-1-fronte.jpg" data-back="1franc-1-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>1994-2001</strong></p></div>
        <div><img src="1franc-2-fronte.jpg" data-front="1franc-2-fronte.jpg" data-back="1franc-2-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>1994-2001</strong></p></div>
    </div>

    <!-- 5 Francs -->
    <h4 style="text-align: left; margin-left: 10%; margin-bottom: 10px;">5 Francs</h4>
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; text-align: center; flex-wrap: wrap;">
        <div><img src="5francs-1-fronte.jpg" data-front="5francs-1-fronte.jpg" data-back="5francs-1-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>1994-2001</strong></p></div>
        <div><img src="5francs-2-fronte.jpg" data-front="5francs-2-fronte.jpg" data-back="5francs-2-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>1994-2001</strong></p></div>
    </div>

    <!-- 20 Francs -->
    <h4 style="text-align: left; margin-left: 10%; margin-bottom: 10px;">20 Francs</h4>
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; text-align: center; flex-wrap: wrap;">
        <div><img src="20francs-1-fronte.jpg" data-front="20francs-1-fronte.jpg" data-back="20francs-1-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>1994-2001</strong></p></div>
        <div><img src="20francs-2-fronte.jpg" data-front="20francs-2-fronte.jpg" data-back="20francs-2-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>1994-2001</strong></p></div>
    </div>

    <!-- 50 Francs -->
    <h4 style="text-align: left; margin-left: 10%; margin-bottom: 10px;">50 Francs</h4>
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 80px; text-align: center; flex-wrap: wrap;">
        <div><img src="50francs-1-fronte.jpg" data-front="50francs-1-fronte.jpg" data-back="50francs-1-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>1994-2001</strong></p></div>
        <div><img src="50francs-2-fronte.jpg" data-front="50francs-2-fronte.jpg" data-back="50francs-2-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>1994-2001</strong></p></div>
        <div><img src="50francs-3-fronte.jpg" data-front="50francs-3-fronte.jpg" data-back="50francs-3-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>2000</strong></p></div>
        <div><img src="50francs-4-fronte.jpg" data-front="50francs-4-fronte.jpg" data-back="50francs-4-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;"><p><strong>2000</strong></p></div>
    </div>

    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

</html>
