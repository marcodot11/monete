<!DOCTYPE html>
<html>
<head>
    <title>Vittorio Emanuele III - Monete</title>
    <!-- Torna indietro di 3 cartelle per trovare il CSS -->
    <link rel="stylesheet" href="../../../style.css"> 
</head>
<body>
    <h1>Regno d'Italia</h1>
    <h2>Vittorio Emanuele III</h2>
    <hr>
    
    <p>Clicca sulla moneta per vedere il retro:</p>
    
    <img src="fronte.jpg" data-front="fronte.jpg" data-back="retro.jpg" onclick="giraMoneta(this)">
    
    <h3>Valore: [Inserire Valore]</h3>
    <p><strong>Anno di emissione:</strong> [Inserire Anno]</p>

    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

</html>
