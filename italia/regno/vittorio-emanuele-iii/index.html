<!DOCTYPE html>
<html>
<head>
    <title>Vittorio Emanuele III - Monete</title>
    <link rel="stylesheet" href="../../../style.css"> 
</head>
<body>
    <h1>Regno d'Italia</h1>
    <h2>Vittorio Emanuele III</h2>
    <hr>
    
    <!-- PRIMO PERIODO O TAGLIO -->
    <h3>1 Centesimo (1904 - 1915)</h3>
    <div class="fila-monete">
        <!-- Moneta 1 -->
        <div class="moneta-singola">
            <img src="1cent-1904-fronte.jpg" data-front="1cent-1904-fronte.jpg" data-back="1cent-1904-retro.jpg" onclick="giraMoneta(this)" width="120" style="border-radius: 50%; cursor: pointer;">
            <p>1 Centesimo 1904</p>
        </div>
        <!-- Moneta 2 -->
        <div class="moneta-singola">
            <img src="1cent-1915-fronte.jpg" data-front="1cent-1915-fronte.jpg" data-back="1cent-1915-retro.jpg" onclick="giraMoneta(this)" width="120" style="border-radius: 50%; cursor: pointer;">
            <p>1 Centesimo 1915</p>
        </div>
    </div>

    <br>

    <!-- SECONDO PERIODO O TAGLIO -->
    <h3>2 Centesimi (1908)</h3>
    <div class="fila-monete">
        <!-- Moneta 3 -->
        <div class="moneta-singola">
            <img src="2cent-1908-fronte.jpg" data-front="2cent-1908-fronte.jpg" data-back="2cent-1908-retro.jpg" onclick="giraMoneta(this)" width="120" style="border-radius: 50%; cursor: pointer;">
            <p>2 Centesimi 1908</p>
        </div>
    </div>

    <!-- Script di rotazione valido per tutte le immagini -->
    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

</body>
</html>
