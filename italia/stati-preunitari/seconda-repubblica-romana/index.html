<!DOCTYPE html>
<html>
<head>
    <title>Seconda Repubblica Romana - Monete</title>
    <link rel="stylesheet" href="../../../style.css"> 
</head>
<body>
    <h1>Stati Preunitari</h1>
    <h2>Seconda Repubblica Romana</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- MONETA: 3 Baiocchi 1849 -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>3 Baiocchi</h3>
        <img src="3baiocchi-fronte.jpg" data-front="3baiocchi-fronte.jpg" data-back="3baiocchi-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1849</strong></p>
    </div>

    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

</html>
