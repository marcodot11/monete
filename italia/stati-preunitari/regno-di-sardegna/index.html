<!DOCTYPE html>
<html>
<head>
    <title>Regno di Sardegna - Monete</title>
    <!-- Torna indietro di 3 cartelle per il CSS -->
    <link rel="stylesheet" href="../../../style.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Stati Preunitari</h1>
    <h2>Regno di Sardegna</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- VITTORIO AMEDEO III -->
    <h3 style="text-align: center; margin-top: 40px;">Vittorio Amedeo III</h3>
    
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; text-align: center; flex-wrap: wrap;">
        
        <!-- 20 Soldi -->
        <div>
            <h4>20 Soldi</h4>
            <img src="20soldi-1796-fronte.jpg" data-front="20soldi-1796-fronte.jpg" data-back="20soldi-1796-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1796</strong></p>
        </div>

    </div>

    <!-- CARLO FELICE -->
    <h3 style="text-align: center; margin-top: 40px; border-top: 1px solid #ccc; padding-top: 30px;">Carlo Felice</h3>
    
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; text-align: center; flex-wrap: wrap;">
        
        <!-- 1 Centesimo -->
        <div>
            <h4>1 Centesimo</h4>
            <img src="1cent-fronte.jpg" data-front="1cent-fronte.jpg" data-back="1cent-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1826</strong></p>
        </div>

        <!-- 1 Lira -->
        <div>
            <h4>1 Lira</h4>
            <img src="1lira-fronte.jpg" data-front="1lira-fronte.jpg" data-back="1lira-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1825</strong></p>
        </div>

    </div>

    <!-- Script per girare le monete -->
    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

    <br><br><hr>

    <a href="../../index.html">Torna a Italia</a><br>
    <a href="../../../index.html">Torna alla Home</a>
</body>
</html>
