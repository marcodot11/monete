<!DOCTYPE html>
<html>
<head>
    <title>Ducato di Parma - Le mie Monete</title>
    <link rel="stylesheet" href="../../../style.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Le monete di Marco</h1>
    <h2>Ducato di Parma</h2>
    <hr>
    
<p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- PRIMA MONETA: 1 Sesino 1788 -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>1 Sesino</h3>
        <img src="fronte.jpg" data-front="fronte.jpg" data-back="retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1788</strong></p>
    </div>

    <!-- SECONDA MONETA: 10 Soldi 1815 -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>10 Soldi</h3>
        <img src="10soldi-fronte.jpg" data-front="10soldi-fronte.jpg" data-back="10soldi-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1815</strong></p>
    </div>
    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

</body>
</html>
