<!DOCTYPE html>
<html>
<head>
    <title>Granducato di Toscana - Monete</title>
    <link rel="stylesheet" href="../../../style.css"> 
</head>
<body>
    <h1>Stati Preunitari</h1>
    <h2>Granducato di Toscana</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

<!-- PRIMA MONETA -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>1 Francescone</h3>
        <img src="fronte.jpg" data-front="fronte.jpg" data-back="retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1796</strong></p>
    </div>

<!-- MONETA CENTRALE (2 Soldi 1804) -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>2 Soldi</h3>
        <img src="2soldi-fronte.jpg" data-front="2soldi-fronte.jpg" data-back="2soldi-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1804</strong></p>
    </div>

    <!-- SECONDA MONETA -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>½ Paolo</h3>
        <img src="paolo-fronte.jpg" data-front="paolo-fronte.jpg" data-back="paolo-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1857</strong></p>
    </div>

    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

    <br><br><hr>

    <a href="../../index.html">Torna a Italia</a><br>
    <a href="../../../index.html">Torna alla Home</a>
</body>
</html>
