<!DOCTYPE html>
<html>
<head>
    <title>Contea di Gorizia - Monete</title>
    <!-- Torna indietro di 3 cartelle per il CSS -->
    <link rel="stylesheet" href="../../../style.css"> 
</head>
<body>
    <h1>Stati Preunitari</h1>
    <h2>Contea di Gorizia</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- PRIMA MONETA: 1 Soldo 1769 -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>1 Soldo</h3>
        <img src="1soldo1769-fronte.jpg" data-front="1soldo1769-fronte.jpg" data-back="1soldo1769-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1769</strong></p>
    </div>

    <!-- SECONDA MONETA: 1 Soldo 1799 -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>1 Soldo</h3>
        <img src="1soldo1799-fronte.jpg" data-front="1soldo1799-fronte.jpg" data-back="1soldo1799-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1799</strong></p>
    </div>

    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

    <br><br><hr>

    <a href="../../index.html">Torna a Italia</a><br>
    <a href="../../../index.html">Torna alla Home</a>
</body>
</html>
