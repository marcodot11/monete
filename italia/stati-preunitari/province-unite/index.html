<!DOCTYPE html>
<html>
<head>
    <title>Province Unite - Monete</title>
    <!-- Torna indietro di 3 cartelle per il CSS -->
    <link rel="stylesheet" href="../../../style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Stati Preunitari</h1>
    <h2>Province Unite</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- RIGA UNICA CON LE TRE MONETE AFFIANCATE -->
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; text-align: center; flex-wrap: wrap;">
        
        <!-- 1 Centesimo 1859 -->
        <div>
            <h3>1 Centesimo</h3>
            <img src="1cent-fronte.jpg" data-front="1cent-fronte.jpg" data-back="1cent-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1859</strong></p>
        </div>

        <!-- 5 Centesimi 1859 (Quella che avevi già) -->
        <div>
            <h3>5 Centesimi</h3>
            <img src="5cent-fronte.jpg" data-front="5cent-fronte.jpg" data-back="5cent-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1859</strong></p>
        </div>

        <!-- 1 Lira 1860 -->
        <div>
            <h3>1 Lira</h3>
            <img src="1lira-fronte.jpg" data-front="1lira-fronte.jpg" data-back="1lira-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1860</strong></p>
        </div>

    </div>

    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

    <br><br><hr>

    <a href="../../index.html">Torna a Italia</a><br>
    <a href="../../../index.html">Torna alla Home</a>
</body>
</html>
