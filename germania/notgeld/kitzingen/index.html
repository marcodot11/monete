<!DOCTYPE html>
<html>
<head>
    <title>Kitzingen - Notgeld</title>
    <!-- Torna indietro di 3 cartelle per il CSS -->
    <link rel="stylesheet" href="../../../style.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Germania</h1>
    <h2>Notgeld - Kitzingen</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- CITTÀ DI KITZINGEN -->
    <h3 style="text-align: center; margin-top: 40px;">Citta' di Kitzingen</h3>
    
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; text-align: center; flex-wrap: wrap;">
        
        <!-- 1 Mark 1921 -->
        <div>
            <h4>1 Mark</h4>
            <img src="1mark-1921-fronte.jpg" data-front="1mark-1921-fronte.jpg" data-back="1mark-1921-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1921</strong></p>
        </div>

    </div>

    <!-- Script per girare le monete -->
    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

</body>
</html>
