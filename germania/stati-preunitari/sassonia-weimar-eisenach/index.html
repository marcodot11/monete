<!DOCTYPE html>
<html>
<head>
    <title>Sassonia-Weimar-Eisenach - Monete</title>
    <!-- Torna indietro di 3 cartelle per il CSS -->
    <link rel="stylesheet" href="../../../style.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Stati Preunitari Tedeschi</h1>
    <h2>Sassonia-Weimar-Eisenach</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- GRANDUCA CARLO ALESSANDRO -->
    <h3 style="text-align: center; margin-top: 40px;">Granduca Carlo Alessandro</h3>
    
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; text-align: center; flex-wrap: wrap;">
        
        <!-- 2 Pfennige 1858 -->
        <div>
            <h4>2 Pfennige</h4>
            <img src="2pfennige-1858-fronte.jpg" data-front="2pfennige-1858-fronte.jpg" data-back="2pfennige-1858-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1858</strong></p>
        </div>

    </div>

    <!-- Script per girare le monete -->
    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

</html>
