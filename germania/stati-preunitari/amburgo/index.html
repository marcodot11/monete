<!DOCTYPE html>
<html>
<head>
    <title>Amburgo - Monete</title>
    <!-- Torna indietro di 3 cartelle per il CSS -->
    <link rel="stylesheet" href="../../../style.css"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Stati Preunitari Tedeschi</h1>
    <h2>Amburgo</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- CITTÀ LIBERA ED ANSEATICA -->
    <h3 style="text-align: center; margin-top: 40px;">Città Libera ed Anseatica</h3>
    
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; text-align: center; flex-wrap: wrap;">
        
        <!-- 1 Sechsling 1855 -->
        <div>
            <h4>1 Sechsling</h4>
            <img src="1sechsling-1855-fronte.jpg" data-front="1sechsling-1855-fronte.jpg" data-back="1sechsling-1855-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1855</strong></p>
        </div>

        <!-- 1 Schilling 1855 -->
        <div>
            <h4>1 Schilling</h4>
            <img src="1schilling-1855-fronte.jpg" data-front="1schilling-1855-fronte.jpg" data-back="1schilling-1855-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1855</strong></p>
        </div>

    </div>

    <!-- CITTÀ LIBERA NELL'IMPERO TEDESCO -->
    <h3 style="text-align: center; margin-top: 40px; border-top: 1px solid #ccc; padding-top: 30px;">Città Libera (Impero Tedesco)</h3>
    
    <div style="display: flex; justify-content: center; gap: 40px; margin-bottom: 50px; text-align: center; flex-wrap: wrap;">
        
        <!-- 2 Mark 1907 -->
        <div>
            <h4>2 Mark</h4>
            <img src="2mark-1907-fronte.jpg" data-front="2mark-1907-fronte.jpg" data-back="2mark-1907-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
            <p><strong>1907</strong></p>
        </div>

    </div>

    <!-- Script per girare le monete -->
    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

    <br><br><hr>

    <a href="../../index.html">Torna a Germania</a><br>
    <a href="../../../index.html">Torna alla Home</a>
</body>
</html>
