<!DOCTYPE html>
<html>
<head>
    <title>Alta Austria - Monete</title>
    <!-- Torna indietro di 3 cartelle per il CSS -->
    <link rel="stylesheet" href="../../../style.css"> 
</head>
<body>
    <h1>Stati Preunitari Austriaci</h1>
    <h2>Alta Austria</h2>
    <hr>
    
    <p style="text-align: center;">Clicca sulle monete per vedere il retro</p>

    <!-- MONETA: 1 Heller 1789 -->
    <div style="text-align: center; margin-bottom: 50px;">
        <h3>1 Heller</h3>
        <img src="1heller-fronte.jpg" data-front="1heller-fronte.jpg" data-back="1heller-retro.jpg" onclick="giraMoneta(this)" style="border-radius: 50%; cursor: pointer;">
        <p><strong>1789</strong></p>
    </div>

    <script>
        function giraMoneta(img) {
            let attuale = img.getAttribute('src');
            let fronte = img.getAttribute('data-front');
            let retro = img.getAttribute('data-back');

            if (attuale === fronte) {
                img.setAttribute('src', retro);
            } else {
                img.setAttribute('src', fronte);
            }
        }
    </script>

    <br><br><hr>

</body>
</html>
